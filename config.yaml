# 股债性价比周度监控 - 配置
# 指数列表：第一个为主指数（周报、走势图用它），其余为对比指数
indices:
  - {code: "000985", name: "中证全指"}
  - {code: "000300", name: "沪深300"}
  - {code: "000905", name: "中证500"}
  - {code: "000922", name: "中证红利"}
  - {code: "000688", name: "科创50"}
  # 创业板50（399673）非中证体系，中证 index-perf 无数据，走乐咕月频PE锚点+腾讯日频收盘价推算
  - {code: "399673", name: "创业板50", source: "cyb50_lg"}

pe_field: "peg"         # 中证指数官网 index-perf 接口中 peg 字段实为市盈率(PE)
start_date: "2014-01-01"

# 信号口径
#   主口径：ERP（股权风险溢价）= 盈利收益率 − 10年期国债收益率
#   单位统一用 bp（1bp = 0.01 个百分点），442bp 即 4.42%
#   「便宜度分位」= 窗口内「比当前更便宜」的天数占比，越低越便宜
signal:
  metric: erp
  tiers:
    - {max: 20,  label: "极端便宜", action: "加仓区", color: "#1b7f4b"}
    - {max: 40,  label: "偏便宜",   action: "定投/加仓", color: "#5aa469"}
    - {max: 60,  label: "中性",     action: "维持配置", color: "#c8971b"}
    - {max: 80,  label: "偏贵",     action: "减少买入", color: "#e0703a"}
    - {max: 100, label: "贵",       action: "防守/再平衡", color: "#c0392b"}
  # 双确认：估值口径（盈利收益率分位）也要够低，避免「只有利率在动」
  confirm_ey_pct: 40

report:
  window_years: [5, 10]
  recent_weeks: 12

# 两市成交额观测（标准化口径：日换手率 = 成交额 ÷ 沪深两市总市值）
#   换手率分位越高 = 交易越拥挤（越热），与 ERP 的「越低越便宜」方向相反
#   924（2024-09-24）之后成交额中枢从 0.5–1 万亿抬升到 1.5–3.5 万亿，
#   分位样本固定从 924 起，避免旧平台把当前读数带偏
turnover:
  pct_start: "2024-09-24"
  tiers:
    - {max: 20,  label: "冷清", color: "#3b6ea5"}
    - {max: 40,  label: "偏冷", color: "#5b8db8"}
    - {max: 60,  label: "正常", color: "#c8971b"}
    - {max: 80,  label: "偏热", color: "#e0703a"}
    - {max: 100, label: "过热", color: "#c0392b"}
  recent_weeks: 12

# 杠杆资金监测（融资余额 ÷ A股流通市值；融资买入额 ÷ 成交额）
#   杠杆率是存量指标，档位用长期历史经验区间（不是分位），分位仅作辅助
#   2% 以下多为历史级别底部区域；3% 以上杠杆资金明显活跃；4% 以上为历史过热区
leverage:
  start: "2014-01-01"
  bands:
    - {max: 2.0,  label: "冰点", range: "< 2.0%",  note: "杠杆资金大量离场，情绪极度悲观，历史级别底部区域", color: "#3b6ea5"}
    - {max: 3.0,  label: "中性", range: "2.0–3.0%", note: "震荡磨底，机会集中在局部，整体风险可控", color: "#c8971b"}
    - {max: 4.0,  label: "活跃", range: "3.0–4.0%", note: "杠杆资金明显活跃，局部过热风险上升", color: "#e0703a"}
    - {max: 100,  label: "过热", range: "≥ 4.0%",  note: "历史级别杠杆过热区，风险大于机会", color: "#c0392b"}
  recent_weeks: 12

# 反向情绪监控（web/sentiment.html）
#   四项指标统一换算成「市场温度」0–100：越高越热（过热/贪婪），越低越冷（冰点/悲观）
#   基金现金分位越高 → 越冷（机构子弹足）；融资余额 20 日跌幅越大 → 越冷；
#   新增开户分位越低 → 越冷；北向成交活跃度分位越低 → 越冷（净流向已停止披露，仅作活跃度代理）
#   低温是左侧分批建仓窗口，高温以防守和再平衡为主；温度是情绪刻度，不是买卖信号
sentiment:
  fund_codes:
    - "000001"   # 华夏成长混合
    - "000011"   # 华夏大盘精选
    - "003567"   # 华夏行业景气
    - "110022"   # 易方达消费行业
    - "005827"   # 易方达蓝筹精选
    - "110011"   # 易方达优质精选
    - "260108"   # 景顺长城新兴成长
    - "163406"   # 兴全合润
    - "163402"   # 兴全趋势投资
    - "519068"   # 汇添富成长焦点
    - "519674"   # 银河创新成长
    - "003095"   # 中欧医疗健康A
    - "002190"   # 农银汇理工业4.0
    - "001156"   # 申万菱信新能源汽车
    - "000083"   # 汇添富消费行业
    - "001102"   # 前海开源国家比较优势
    - "001714"   # 工银文体产业A
    - "000751"   # 嘉实新兴产业
    - "001186"   # 富国文体健康A
    - "519133"   # 海富通改革驱动
    - "002001"   # 华夏回报A
    - "161005"   # 富国天惠成长A
    - "540003"   # 汇丰晋信动态策略A
    - "400011"   # 东方核心动力A
    - "005847"   # 富国沪港深业绩驱动A
  fund_pct_years: 10         # 基金现金分位窗口；样本从 2014 起
  account_pct_years: 5       # 上交所月报从 2021-12 起，分位窗口不能更长
  north_pct_years: 5         # 北向成交活跃度分位窗口
  north_trend_days: 250      # 北向去趋势均线：相对活跃度 = deal_ma20 / deal_ma250，消除长期增长带来的分位虚高
  margin_tiers:              # 融资余额近 20 交易日涨跌幅（按开区间上界）
    - {max: -8,  label: "恐慌平仓", note: "杠杆资金快速离场，恐慌性去杠杆，历史上常对应底部区域", color: "#2f6f9f"}
    - {max: -4,  label: "快速去杠杆", note: "融资盘明显收缩，情绪转向谨慎，可开始分批关注", color: "#5b8db8"}
    - {max: 2,   label: "震荡",     note: "杠杆资金变化平缓，暂无极端信号", color: "#c8971b"}
    - {max: 100, label: "加杠杆",   note: "融资余额持续上升，风险偏好回暖，追高性价比下降", color: "#e0703a"}
  score_tiers:               # 市场温度 0–100，越高越热（0 冰点/极端悲观，100 过热/贪婪）
    - {max: 20,  label: "极端悲观", note: "多项反向指标共振，情绪冰点，是左侧分批建仓的重要窗口", color: "#2f6f9f"}
    - {max: 40,  label: "偏悲观",   note: "多项指标进入悲观区，可按计划加大分批买入力度", color: "#5b8db8"}
    - {max: 60,  label: "中性",     note: "情绪没有明显极值，维持定投与配置节奏", color: "#c8971b"}
    - {max: 80,  label: "偏乐观",   note: "市场情绪偏暖，保持既定仓位，不追高", color: "#e0703a"}
    - {max: 101, label: "情绪过热", note: "四项指标都偏乐观，增量资金拥挤，以防守和再平衡为主", color: "#c0392b"}

# 推送渠道：仅飞书。Webhook 是敏感凭据，存放在 .env（不入 git）
push:
  feishu:                # 飞书群机器人（群设置 → 群机器人 → 添加自定义机器人 → 复制 Webhook）
    enabled: true
    webhook: "${FEISHU_WEBHOOK}"

python: /opt/homebrew/anaconda3/bin/python3
