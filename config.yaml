# 股债性价比周度监控 - 配置
# 指数列表：第一个为主指数（周报、走势图用它），其余为对比指数
indices:
  - {code: "000985", name: "中证全指"}
  - {code: "000300", name: "沪深300"}
  - {code: "000905", name: "中证500"}
  - {code: "000922", name: "中证红利"}
  - {code: "000688", name: "科创50"}

pe_field: "peg"         # 中证指数官网 index-perf 接口中 peg 字段实为市盈率(PE)
start_date: "2014-01-01"

# 信号口径
#   主口径：ERP（股权风险溢价）= 盈利收益率 − 10年期国债收益率
#   单位统一用 bp（1bp = 0.01 个百分点），442bp 即 4.42%
#   「便宜度分位」= 窗口内「比当前更便宜」的天数占比，越低越便宜
signal:
  metric: erp
  tiers:
    - {max: 20,  label: "极端便宜", action: "加仓区", color: "#1b7f4b"}
    - {max: 40,  label: "偏便宜",   action: "定投/加仓", color: "#5aa469"}
    - {max: 60,  label: "中性",     action: "维持配置", color: "#c8971b"}
    - {max: 80,  label: "偏贵",     action: "减少买入", color: "#e0703a"}
    - {max: 100, label: "贵",       action: "防守/再平衡", color: "#c0392b"}
  # 双确认：估值口径（盈利收益率分位）也要够低，避免「只有利率在动」
  confirm_ey_pct: 40

report:
  window_years: [5, 10]
  recent_weeks: 12

# 两市成交额观测（标准化口径：日换手率 = 成交额 ÷ 沪深两市总市值）
#   换手率分位越高 = 交易越拥挤（越热），与 ERP 的「越低越便宜」方向相反
#   924（2024-09-24）之后成交额中枢从 0.5–1 万亿抬升到 1.5–3.5 万亿，
#   分位样本固定从 924 起，避免旧平台把当前读数带偏
turnover:
  pct_start: "2024-09-24"
  tiers:
    - {max: 20,  label: "冷清", color: "#3b6ea5"}
    - {max: 40,  label: "偏冷", color: "#5b8db8"}
    - {max: 60,  label: "正常", color: "#c8971b"}
    - {max: 80,  label: "偏热", color: "#e0703a"}
    - {max: 100, label: "过热", color: "#c0392b"}
  recent_weeks: 12

# 推送渠道：仅飞书。Webhook 是敏感凭据，存放在 .env（不入 git）
push:
  feishu:                # 飞书群机器人（群设置 → 群机器人 → 添加自定义机器人 → 复制 Webhook）
    enabled: true
    webhook: "${FEISHU_WEBHOOK}"

python: /opt/homebrew/anaconda3/bin/python3
